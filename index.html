<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grupo de Estudo</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <header class="topo">
      <h1>📚 Grupo de Estudo</h1>
      <p class="sub">Controle de livros, encontros e presença</p>
    </header>

    <section class="card dados">
  <h2>🧰 Backup e dados</h2>
  <p class="small">
    Baixe um backup do seu grupo ou carregue um arquivo .json para restaurar. (Ao importar, substitui tudo.)
  </p>

  <div class="linha">
    <button id="btn-export" type="button">Baixar backup</button>

    <button id="btn-import" type="button" class="btn-sec">Carregar backup</button>
    <input id="file-import" type="file" accept="application/json" style="display:none;" />

    <button id="btn-clear" type="button" class="btn-del">Limpar dados</button>
  </div>
</section>


    <!-- 1) LIVROS -->
    <section class="card livros">
      <h2>📖 Livros estudados</h2>

      <form id="form-livro" class="linha">
        <label class="campo">
          <span>Nome do livro:</span>
          <input id="livro-nome" type="text" placeholder="Ex.: O custo do discipulado" />
        </label>

        <button type="submit">Adicionar</button>
      </form>

      <div class="linha">
        <label class="campo">
          <span>Livro atual</span>
          <select id="livro-atual"></select>
        </label>

        <span id="livro-atual-info" class="badge"></span>
      </div>

      <ul id="lista-livros" class="lista"></ul>
    </section>

    <!-- 2) NOVO EVENTO -->
    <section class="card criar-evento">
      <h2>🗓️ Criar evento</h2>

      <form id="form-evento" class="coluna">
        <div class="linha">
          <label class="campo">
            <span>Data</span>
            <input id="evento-data" type="date" />
          </label>

          <label class="campo">
            <span>Capítulos (texto livre)</span>
            <input id="evento-capitulos" type="text" placeholder="Ex.: 1-3 e 5 / Cap. 7 e 8" />
          </label>
        </div>

        <label class="campo">
          <span>Temas centrais</span>
          <textarea id="evento-temas" rows="3" placeholder="Ex.: Discipulado, renúncia, custo da fé..."></textarea>
        </label>

        <div class="divisor"></div>

        <h3 class="mini">✅ Presença</h3>

        <div class="linha">
          <label class="campo">
            <span>Nome</span>
            <input id="presenca-nome" type="text" placeholder="Ex.: Elder" />
          </label>

          <label class="check">
            <input id="presenca-visitante" type="checkbox" />
            Visitante
          </label>

          <button id="btn-add-presenca" type="button">Adicionar</button>
        </div>

        <ul id="lista-presenca-temp" class="lista"></ul>

        <div class="linha fim">
  <button id="btn-cancelar-edicao" type="button" class="btn-sec" style="display:none;">
    Cancelar edição
  </button>

  <button id="btn-salvar-evento" type="submit">Salvar evento</button>
</div>

      </form>
    </section>

    <!-- 3) EVENTOS SALVOS -->
    <section class="card eventos-salvos">
      <h2>📌 Eventos salvos</h2>
      <ul id="lista-eventos" class="lista"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
